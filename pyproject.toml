[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-drift-benchmark"
version = "0.1.0"
description = "A benchmark for constraint erosion across multi-turn AI coding tasks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mika Flowers" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
kaggle = ["kaggle-benchmarks>=0.7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "scenarios"]
addopts = "-q"
